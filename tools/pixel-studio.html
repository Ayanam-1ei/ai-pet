<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clawd Mochi · 像素画板</title>
<style>
  :root {
    --bg: #14101c;
    --panel: #1c1726;
    --line: #2e2638;
    --txt: #f2ebe3;
    --mut: #9a8f9f;
    --accent: #ff783c;
    --accent2: #ffd23c;
    --ok: #3dd68c;
    --err: #ff5c7a;
  }
  * { box-sizing: border-box; user-select: none; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #2a1840 0%, var(--bg) 55%);
    color: var(--txt);
    font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: rgba(20,16,28,.7); backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .04em; }
  header h1 span { color: var(--accent); }
  .badge {
    font-size: 12px; color: var(--mut);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  main {
    flex: 1; display: grid;
    grid-template-columns: 1fr 280px; gap: 16px;
    padding: 16px 20px 20px; max-width: 1100px; width: 100%; margin: 0 auto;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .board-wrap {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .board-hint { color: var(--mut); font-size: 12px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(48, 10px);
    grid-template-rows: repeat(48, 10px);
    gap: 0;
    border: 2px solid #0a0810;
    box-shadow: 0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.45);
    cursor: crosshair;
    touch-action: none;
    image-rendering: pixelated;
  }
  #grid .px {
    width: 10px; height: 10px;
    background: #000;
  }
  #grid .px:hover { outline: 1px solid rgba(255,255,255,.35); outline-offset: -1px; }

  .side {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column; gap: 14px;
  }
  .side h2 {
    margin: 0; font-size: 12px; font-weight: 600; color: var(--mut);
    text-transform: uppercase; letter-spacing: .08em;
  }
  #previewBox {
    width: 100%; aspect-ratio: 1; background: #000;
    border-radius: 10px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #preview {
    width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  #palette {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
  }
  .sw {
    aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent;
    cursor: pointer;
  }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .file-btn {
    appearance: none; border: 1px solid var(--line); background: #241c30;
    color: var(--txt); border-radius: 8px; padding: 8px 12px; font-size: 13px;
    cursor: pointer;
  }
  button:hover, .file-btn:hover { border-color: var(--accent); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #ff9a3c);
    border: none; color: #1a0f08; font-weight: 700;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; }
  #status {
    min-height: 1.2em; font-size: 12px; color: var(--mut);
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  input[type="color"] {
    width: 42px; height: 32px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; padding: 0; cursor: pointer;
  }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools button.on { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CLAWD <span>MOCHI</span> · 像素画板</h1>
  <div class="badge">48×48 · ×5 · ST7789</div>
</header>
<main>
  <section class="board-wrap">
    <div id="grid" aria-label="pixel grid"></div>
    <div class="board-hint">左键涂色 · 右键擦除 · 按住拖动连续画</div>
  </section>

  <aside class="side">
    <div>
      <h2>设备预览</h2>
      <div id="previewBox"><canvas id="preview" width="48" height="48"></canvas></div>
    </div>

    <div>
      <h2>调色板</h2>
      <div id="palette"></div>
      <div class="row" style="margin-top:8px">
        <input type="color" id="customColor" value="#ff783c" title="自定义颜色" />
        <button id="useCustom" class="ghost">用自定义色</button>
      </div>
    </div>

    <div>
      <h2>工具</h2>
      <div class="tools">
        <button id="toolPen" class="on">画笔</button>
        <button id="toolEraser">橡皮</button>
        <button id="btnClear">清空</button>
        <button id="btnFillBg">铺底色</button>
        <button id="btnUndo">撤销</button>
        <button id="btnDemo">示例脸</button>
      </div>
    </div>

    <div>
      <h2>输出</h2>
      <div class="row">
        <button id="btnPush" class="primary" style="flex:1">推送到麻薯</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnSave" class="ghost" style="flex:1">保存 JSON</button>
        <button id="btnLoad" class="ghost" style="flex:1">加载 JSON</button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden />
      </div>
      <div id="status" style="margin-top:8px"></div>
    </div>
  </aside>
</main>

<script>
(() => {
  const W = 48, H = 48;
  const grid = document.getElementById('grid');
  const preview = document.getElementById('preview');
  const pctx = preview.getContext('2d');
  const statusEl = document.getElementById('status');
  const paletteEl = document.getElementById('palette');

  const PALETTE = [
    '#000000','#1a1220','#3a2a28','#201628',
    '#ffeac8','#ffd7a8','#ffb07a','#ff783c',
    '#e84545','#c22f2f','#7a2030','#ff9ab8',
    '#ffffff','#d8d0e0','#9a8f9f','#5c5468',
    '#3dd68c','#1faa6a','#0d6b4a','#7cf0c0',
    '#5ec8ff','#3a7bd5','#2a3f9a','#1a2040',
    '#ffd23c','#f0a020','#c08040','#8a5a20',
    '#b07cff','#7a4dcc','#4a2a8a','#2a1840'
  ];

  let cells = new Array(W * H).fill('#000000');
  let color = '#ffeac8';
  let tool = 'pen';
  let painting = false;
  let eraseBtn = false;
  let history = [];

  // build grid
  const nodes = [];
  for (let i = 0; i < W * H; i++) {
    const d = document.createElement('div');
    d.className = 'px';
    d.dataset.i = i;
    grid.appendChild(d);
    nodes.push(d);
  }

  // palette
  PALETTE.forEach((c) => {
    const b = document.createElement('div');
    b.className = 'sw';
    b.style.background = c;
    b.title = c;
    b.onclick = () => {
      color = c;
      tool = 'pen';
      syncTools();
      [...paletteEl.children].forEach(el => el.classList.remove('on'));
      b.classList.add('on');
    };
    paletteEl.appendChild(b);
  });
  paletteEl.children[7].classList.add('on');

  function rgbToRgb565Int(r, g, b) {
    return ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
  }
  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16)
    };
  }
  function hexToRgb565Hex(hex) {
    const { r, g, b } = hexToRgb(hex);
    return rgbToRgb565Int(r, g, b).toString(16).padStart(4, '0');
  }

  function pushHistory() {
    history.push(cells.slice());
    if (history.length > 40) history.shift();
  }

  function paint(i, c) {
    if (cells[i] === c) return;
    cells[i] = c;
    nodes[i].style.background = c;
  }

  function refreshAll() {
    for (let i = 0; i < cells.length; i++) nodes[i].style.background = cells[i];
    drawPreview();
  }

  function drawPreview() {
    const img = pctx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const { r, g, b } = hexToRgb(cells[i]);
      img.data[i * 4] = r;
      img.data[i * 4 + 1] = g;
      img.data[i * 4 + 2] = b;
      img.data[i * 4 + 3] = 255;
    }
    pctx.putImageData(img, 0, 0);
  }

  function idxFromEvent(e) {
    const t = document.elementFromPoint(e.clientX, e.clientY);
    if (!t || !t.dataset || t.dataset.i === undefined) return -1;
    return +t.dataset.i;
  }

  function applyAt(i) {
    if (i < 0) return;
    const c = (tool === 'eraser' || eraseBtn) ? '#000000' : color;
    paint(i, c);
    drawPreview();
  }

  grid.addEventListener('contextmenu', e => e.preventDefault());
  grid.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pushHistory();
    painting = true;
    eraseBtn = (e.button === 2);
    grid.setPointerCapture(e.pointerId);
    applyAt(idxFromEvent(e));
  });
  grid.addEventListener('pointermove', (e) => {
    if (!painting) return;
    applyAt(idxFromEvent(e));
  });
  grid.addEventListener('pointerup', () => { painting = false; eraseBtn = false; });
  grid.addEventListener('pointercancel', () => { painting = false; eraseBtn = false; });

  function syncTools() {
    document.getElementById('toolPen').classList.toggle('on', tool === 'pen');
    document.getElementById('toolEraser').classList.toggle('on', tool === 'eraser');
  }
  document.getElementById('toolPen').onclick = () => { tool = 'pen'; syncTools(); };
  document.getElementById('toolEraser').onclick = () => { tool = 'eraser'; syncTools(); };
  document.getElementById('btnClear').onclick = () => {
    pushHistory();
    cells.fill('#000000');
    refreshAll();
  };
  document.getElementById('btnFillBg').onclick = () => {
    pushHistory();
    cells.fill(color);
    refreshAll();
  };
  document.getElementById('btnUndo').onclick = () => {
    if (!history.length) return;
    cells = history.pop();
    refreshAll();
  };
  document.getElementById('useCustom').onclick = () => {
    color = document.getElementById('customColor').value;
    tool = 'pen';
    syncTools();
    [...paletteEl.children].forEach(el => el.classList.remove('on'));
  };

  document.getElementById('btnDemo').onclick = () => {
    pushHistory();
    cells.fill('#000000');
    // 简单麻薯脸示例
    const body = '#ffeac8', ink = '#3a2a28', acc = '#ff783c';
    for (let y = 10; y < 40; y++) {
      for (let x = 8; x < 40; x++) {
        const cx = x - 24, cy = y - 26;
        if (cx * cx / 250 + cy * cy / 180 < 1) cells[y * W + x] = body;
      }
    }
    // 眼
    for (let y = 22; y < 27; y++) {
      cells[y * W + 18] = ink; cells[y * W + 19] = ink;
      cells[y * W + 28] = ink; cells[y * W + 29] = ink;
    }
    // 嘴
    for (let x = 21; x < 27; x++) cells[32 * W + x] = ink;
    // 钳
    cells[26 * W + 6] = acc; cells[26 * W + 7] = acc;
    cells[26 * W + 40] = acc; cells[26 * W + 41] = acc;
    refreshAll();
    setStatus('已填入示例脸，可改完再推送', 'ok');
  };

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  document.getElementById('btnPush').onclick = async () => {
    const btn = document.getElementById('btnPush');
    btn.disabled = true;
    setStatus('推送中…');
    try {
      const res = await fetch('/api/push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ w: W, h: H, pixels: cells })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        setStatus(`已推送到 ${data.port || '设备'}`, 'ok');
      } else {
        setStatus(data.error || '推送失败', 'err');
      }
    } catch (err) {
      setStatus('无法连接本地服务: ' + err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  };

  document.getElementById('btnSave').onclick = () => {
    const blob = new Blob([JSON.stringify({ w: W, h: H, pixels: cells }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mochi-sprite.json';
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus('已导出 JSON', 'ok');
  };
  const fileInput = document.getElementById('fileInput');
  document.getElementById('btnLoad').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.pixels || data.pixels.length !== W * H) throw new Error('尺寸不是 48×48');
      pushHistory();
      cells = data.pixels.map(c => c.startsWith('#') ? c : '#' + c);
      refreshAll();
      setStatus('已加载', 'ok');
    } catch (e) {
      setStatus('加载失败: ' + e.message, 'err');
    }
    fileInput.value = '';
  };

  refreshAll();
  setStatus('就绪 — 点「示例脸」可快速看效果');
})();
</script>
</body>
</html>
